   ============================================================ */

        document

        userType.includes('business');

/* ============================================================
   LOAD EDUCATION DATA
   KEEPING YOUR EXISTING API CONTRACT
   ============================================================ */

function loadEducationContent(){

    const container =
        document.getElementById(
            'educationContainer'
        );

    if (!container) return;

    container.innerHTML = `
        <div class="loading-line">
            <span class="spin"></span>
            Loading education content…
        </div>
    `;

    Promise.all([

        fetch('/api/education/bursaries/')
            .then(r => r.json())
            .catch(() => ({})),

        fetch('/api/education/universities/')
            .then(r => r.json())
            .catch(() => ({})),

        fetch('/api/education/schools/')
            .then(r => r.json())
            .catch(() => ({})),

        fetch('/api/education/question-papers/')
            .then(r => r.json())
            .catch(() => ({
                success:false,
                papers:[]
            }))

    ])
    .then(([
        bursariesData,
        universitiesData,
        schoolsData,
        papersData
    ]) => {

        const items = [];


        /* -------------------------
           BURSARIES
           ------------------------- */

        (
            bursariesData.bursaries ||
            bursariesData.results ||
            []
        ).forEach(b => {

            items.push({

                type:'bursary',

                id:b.id,

                title:
                    b.title ||
                    'Bursary',

                description:
                    b.description ||
                    '',

                institution:
                    b.provider ||
                    'Unknown provider',

                image:
                    b.image ||
                    b.provider_logo ||
                    null,

                amount:
                    b.amount
                        ? `R${Number(b.amount).toLocaleString()}`
                        : 'Amount varies',

                closing_date:
                    b.closing_date ||
                    null,

                is_featured:
                    Boolean(b.is_featured),

                likes:
                    b.likes_count ||
                    0,

                comments:
                    b.comments_count ||
                    0

            });

        });


        /* -------------------------
           UNIVERSITIES
           ------------------------- */

        (
            universitiesData.universities ||
            universitiesData.results ||
            []
        ).forEach(u => {

            items.push({

                type:'university',

                id:u.id,

                title:
                    u.name ||
                    'University',

                description:
                    u.description ||
                    '',

                institution:
                    u.city ||
                    u.province ||
                    '',

                image:
                    u.logo ||
                    u.image ||
                    null,

                is_featured:
                    Boolean(u.is_featured),

                likes:
                    u.likes_count ||
                    0,

                comments:
                    u.comments_count ||
                    0

            });

        });


        /* -------------------------
           SCHOOLS
           ------------------------- */

        (
            schoolsData.schools ||
            schoolsData.results ||
            []
        ).forEach(s => {

            const location = [
                s.city,
                s.province
            ]
                .filter(Boolean)
                .join(', ');

            items.push({

                type:'school',

                id:s.id,

                title:
                    s.name ||
                    'School',

                description:
                    s.address ||
                    '',

                institution:
                    location,

                image:
                    s.logo ||
                    s.image ||
                    null,

                is_featured:
                    Boolean(s.is_featured),

                likes:
                    s.likes_count ||
                    0,

                comments:
                    s.comments_count ||
                    0

            });

        });


        /* -------------------------
           QUESTION PAPERS
           ------------------------- */

        (
            papersData.papers ||
            papersData.results ||
            []
        ).forEach(p => {

            const grade =
                p.grade?.name ||
                '';

            const subject =
                p.subject?.name ||
                '';

            items.push({

                type:'paper',

                id:p.id,

                title:
                    p.title ||
                    'Question paper',

                description:
                    [grade, subject]
                        .filter(Boolean)
                        .join(' · '),

                institution:
                    p.year ||
                    '',

                grade,

                subject,

                year:
                    p.year ||
                    '',

                file_url:
                    p.file ||
                    null,

                likes:
                    p.likes_count ||
                    0,

                comments:
                    p.comments_count ||
                    0

            });

        });


        allEducationItems = items;


        /* Homepage strip */

        renderEduMiniScroll(
            items.slice(0,8)
        );


        /* Full education page */

        renderEducationItems(
            items,
            container
        );


        checkEduUserType();

    })
    .catch(() => {

        container.innerHTML = `
            <div class="empty-state">

                <i class="fas fa-triangle-exclamation"></i>

                <h4>
                    Couldn't load education content
                </h4>

                <p>
                    Please refresh the page.
                </p>

            </div>
        `;

    });

}

function renderEduMiniScroll(items){

    const container =
        document.getElementById(
            'eduMiniScroll'
        );

    if (!container) return;


    if (!items || !items.length){

        container.innerHTML = `
            <div class="education-home-empty">

                <i class="fas fa-graduation-cap"></i>

                No education content yet.

            </div>

        return;

    container.innerHTML =
        items
            .map(createEducationHomeCard)
            .join('');

/* ============================================================
   HOME CARD BUILDER
   ============================================================ */

function createEducationHomeCard(item){

    const image =
        item.image &&
        String(item.image).trim().length > 10
            ? String(item.image).trim()
            : null;


    const typeLabels = {

        bursary:'Bursary',

        university:'University',

        school:'School',

        paper:'Question paper'

    };


    const typeLabel =
        typeLabels[item.type] ||
        'Education';


    let provider =
        item.institution ||
        '';


    if (
        item.type === 'paper' &&
        item.grade
    ){

        provider = [
            item.grade,
            item.subject
        ]
        .filter(Boolean)
        .join(' · ');

    }


    let value = '';

    if (item.type === 'bursary'){

        value =
            item.amount ||
            'View opportunity';

    }
    else if (item.type === 'paper'){

        value =
            item.year ||
            'Question paper';

    }
    else {

        value =
            item.city ||
            'View details';

    }


    const media = image

        ? `
            <div class="edu-home-media">

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(item.title || typeLabel)}"
                    loading="lazy"
                    onerror="educationHomeImageError(this)"
                >

                <span class="edu-home-type">
                    ${typeLabel}
                </span>

                ${
                    item.is_featured
                        ? `
                            <span
                                class="edu-home-featured"
                                title="Featured">
                                <i class="fas fa-star"></i>
                            </span>
                          `
                        : ''
                }

            </div>
          `

        : `
            <div class="edu-home-media no-image">

                <span class="edu-home-empty">
                    ${typeLabel}
                </span>

                <span class="edu-home-type">
                    ${typeLabel}
                </span>

                ${
                    item.is_featured
                        ? `
                            <span
                                class="edu-home-featured"
                                title="Featured">
                                <i class="fas fa-star"></i>
                            </span>
                          `
                        : ''
                }

            </div>
          `;


    return `

        <article
            class="edu-home-card"
            data-education-type="${escapeHtml(item.type)}"
            data-education-id="${escapeHtml(String(item.id))}"
            tabindex="0"
            role="button"
            aria-label="Open ${escapeHtml(item.title || typeLabel)}">

            ${media}


            <div class="edu-home-body">

                <div class="edu-home-card-title">
                    ${escapeHtml(item.title || typeLabel)}
                </div>


                <div class="edu-home-provider">

                    ${
                        provider
                            ? `
                                <i class="fas fa-location-dot"></i>
                                ${escapeHtml(provider)}
                              `
                            : 'Education opportunity'
                    }

                </div>


                <div class="edu-home-meta">

                    <span
                        class="edu-home-value
                        ${!value ? 'neutral' : ''}">

                        ${escapeHtml(value)}

                    </span>


                    <span class="edu-home-likes">

                        <i class="fas fa-heart"></i>

                        ${formatNumber(item.likes || 0)}

                    </span>

                </div>

            </div>


            <div class="edu-home-footer">

                <span class="edu-home-view">

                    View details

                    <i class="fas fa-arrow-right"></i>

                </span>

            </div>

        </article>

    `;
}


/* ============================================================
   IMAGE ERROR
   IMPORTANT:
   NO FAKE LOGO
   ============================================================ */

function educationHomeImageError(img){

    if (!img) return;

    const media =
        img.closest('.edu-home-media');

    if (!media) return;

    img.remove();

    media.classList.add(
        'no-image'
    );

    const type =
        media.querySelector(
            '.edu-home-type'
        )?.textContent?.trim() ||
        'Education';


    if (
        !media.querySelector(
            '.edu-home-empty'
        )
    ){

        const empty =
            document.createElement('span');

        empty.className =
            'edu-home-empty';

        empty.textContent =
            type;

        media.prepend(empty);

    }

}

/* ============================================================
   FULL EDUCATION PAGE
   ============================================================ */

function renderEducationItems(
    items,
    container
){

    container ||=
        document.getElementById(
            'educationContainer'
        );

    if (!container) return;


    let filtered =
        educationFilter === 'all'
            ? items
            : items.filter(
                item =>
                    item.type === educationFilter
              );


    const query =
        document
            .getElementById(
                'eduSearchInput'
            )
            ?.value
            ?.trim()
            ?.toLowerCase() ||
        '';


    if (query){

        filtered =
            filtered.filter(item => {

                const title =
                    String(
                        item.title || ''
                    ).toLowerCase();

                const institution =
                    String(
                        item.institution || ''
                    ).toLowerCase();

                const description =
                    String(
                        item.description || ''
                    ).toLowerCase();

                return (
                    title.includes(query) ||
                    institution.includes(query) ||
                    description.includes(query)
                );

            });

    }


    if (!filtered.length){

        container.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-graduation-cap"></i>

                <h4>
                    Nothing here yet
                </h4>

                <p>
                    ${
                        isBusinessUser
                            ? 'Use the buttons above to add content.'
                            : 'Check back soon for new listings.'
                    }
                </p>

            </div>

        `;

        return;

    }


    const groups = {

        bursary:
            filtered.filter(
                item => item.type === 'bursary'
            ),

        university:
            filtered.filter(
                item => item.type === 'university'
            ),

        school:
            filtered.filter(
                item => item.type === 'school'
            ),

        paper:
            filtered.filter(
                item => item.type === 'paper'
            )

    };


    const groupLabels = {

        bursary:'Bursaries',

        university:'Universities',

        school:'Schools',

        paper:'Question papers'

    };


    let html = '';


    Object.entries(groups)
        .forEach(
            ([type, typeItems]) => {

                if (!typeItems.length){
                    return;
                }


                html += `

                    <section
                        class="edu-group">

                        <div
                            class="edu-group-head">

                            <div
                                class="edu-group-title">

                                <h3>
                                    ${groupLabels[type]}
                                </h3>

                            </div>

                            <span
                                class="edu-group-count">

                                ${typeItems.length}

                            </span>

                        </div>


                        <div
                            class="edu-group-grid">

                `;


                typeItems.forEach(
                    item => {

                        if (
                            item.type === 'paper'
                        ){

                            html +=
                                createQuestionPaperCard(
                                    item
                                );

                            return;

                        }


                        html +=
                            createEducationFullCard(
                                item
                            );

                    }
                );


                html += `

                        </div>

                    </section>

                `;

            }
        );


    container.innerHTML = html;

}

    meta += `

    const buttonText =

                <div
                    class="edu-card-title">

                    ${escapeHtml(
                        item.title ||
                        typeLabel
                    )}

                </div>


                ${
                    item.institution
                        ? `

                            <div
                                class="edu-card-sub">

                                <i class="fas fa-location-dot"></i>

                                ${escapeHtml(
                                    item.institution
                                )}

                            </div>

                          `

                }


                <div
                    class="edu-card-desc">

                    ${escapeHtml(
                        description
                    )}

                </div>


                <div
                    class="edu-card-meta">

                    ${meta}

                </div>

            </div>


            <div
                class="edu-card-foot">

                    class="edu-go-btn"

                    <i class="fas fa-share-nodes"></i>

                </button>

            </div>

        </article>

    `;

}


/* ============================================================
   FULL CARD IMAGE ERROR
   ============================================================ */

function educationFullImageError(
    img,
    typeLabel
){

    if (!img) return;

    const card =
        img.closest('.edu-card');

    if (!card) return;

    const oldMedia =
        img.closest('.edu-card-img');

    if (!oldMedia) return;


    const replacement =
        document.createElement('div');

    replacement.className =
        'edu-card-no-image';


    const label =
        document.createElement('span');

    label.className =
        'edu-card-no-image-label';

    label.textContent =
        typeLabel ||
        'Education';


    replacement.appendChild(
        label
    );


    const badge =
        document.createElement('span');

    badge.className =
        'edu-badge-flag';

    badge.textContent =
        typeLabel ||
        'Education';


    replacement.appendChild(
        badge
    );


    oldMedia.replaceWith(
        replacement
    );

}

    id
){

/* ============================================================
   SHARE EDUCATION
   ============================================================ */

function shareEducationItem(
    type,
    id,
    title
){

    const url =
        `${window.location.origin}/education/${type}/${id}/`;


    const text =
        `${title || 'Education content'} - ${url}`;


    if (
        navigator.clipboard
    ){

        navigator.clipboard
            .writeText(text)
            .then(
                () =>
                    showToast(
                        'Link copied!',
                        'success'
                    )
            )
            .catch(
                () =>
                    showToast(
                        'Copy the link from your address bar',
                        'info'
                    )
            );

    }
    else {

        showToast(
            text,
            'info'
        );

    }

}

/* ============================================================
   CLOSE UPLOAD
   ============================================================ */

function closeEduUploadModal(){

    document
        .getElementById(
            'eduUploadModal'
        )
        ?.classList
        .remove('show');

}


/* ============================================================
   SUBMIT UPLOAD
   ============================================================ */

function submitEduUpload(){

    const form =
        document.getElementById(
            'eduUploadForm'
        );

    if (!form) return;


    const formData =
        new FormData(form);


    const btn =
        document.querySelector(
            '#eduUploadModal .modal-box-foot .btn-jade'
        );


    if (!btn) return;


    const original =
        btn.innerHTML;


    btn.innerHTML = `
        <span
            class="spin"
            style="
                width:13px;
                height:13px;
            ">
        </span>
        Uploading…
    `;

    btn.disabled = true;


    const endpoints = {

        school:
            '/api/education/schools/',

        bursary:
            '/api/education/bursaries/',

        university:
            '/api/education/universities/',

        paper:
            '/api/education/question-papers/'

    };


    fetch(
        endpoints[eduUploadType] ||
        endpoints.school,
        {
            method:'POST',

            headers:{
                'X-CSRFToken':
                    getCSRFToken()
            },

            body:formData
        }
    )
    .then(r => r.json())
    .then(data => {

        btn.innerHTML =
            original;

        btn.disabled =
            false;


        if (
            data.id ||
            data.name ||
            data.title ||
            data.success
        ){

            closeEduUploadModal();

            showToast(
                'Education content uploaded successfully!',
                'success'
            );

            loadEducationContent();

        }
        else {

            showToast(
                data.error ||
                'Upload failed. Please check the information.',
                'error'
            );

        }

    })
    .catch(() => {

        btn.innerHTML =
            original;

        btn.disabled =
            false;

        showToast(
            'Network error — please try again.',
            'error'
        );

    });

}

</script>
