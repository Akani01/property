<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Tolleya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8f9fa;
            color: #333;
            padding: 20px;
        }
        .offline-container {
            text-align: center;
            max-width: 500px;
            background: white;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .offline-icon {
            font-size: 72px;
            margin-bottom: 20px;
            color: #6c757d;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }
        p {
            color: #6c757d;
            margin-bottom: 8px;
            line-height: 1.6;
        }
        .btn-group {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            font-size: 16px;
        }
        .btn:hover {
            background: #0b5ed7;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5c636a;
        }
        .btn-outline {
            background: transparent;
            color: #6c757d;
            border: 2px solid #dee2e6;
        }
        .btn-outline:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
        }
        .mt-3 {
            margin-top: 15px;
        }
        .text-muted {
            color: #999;
        }
        .small {
            font-size: 13px;
        }
        .emoji {
            font-size: 72px;
            line-height: 1;
        }
        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
            }
            .btn {
                width: 100%;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="emoji">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection.</p>
        <p class="text-muted small">Don't worry, you can still access some content once you reconnect.</p>
        
        <div class="btn-group">
            <button class="btn" onclick="location.reload()">
                🔄 Retry
            </button>
            <a href="/" class="btn btn-secondary">
                🏠 Home
            </a>
        </div>
        
        <p class="text-muted small mt-3">
            <i>Last visited: <span id="previousPage">/</span></i>
        </p>
    </div>

    <script>
        // Try to get the previous page from localStorage
        try {
            const prev = localStorage.getItem('lastVisitedPage') || '/';
            document.getElementById('previousPage').textContent = prev;
        } catch(e) {
            // Fallback
        }
        
        // Save current page for future reference
        try {
            localStorage.setItem('lastVisitedPage', window.location.pathname);
        } catch(e) {}
    </script>
</body>
</html>
