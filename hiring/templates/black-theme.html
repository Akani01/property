<!-- Shared OppoGlobe appearance control: legacy tolleya_theme replaced. -->
<button type="button" class="og-theme-toggle" onclick="window.OppoGlobeTheme && OppoGlobeTheme.set(OppoGlobeTheme.get()==='dark'?'light':'dark')" aria-label="Switch light or dark theme">◐ <span data-og-theme-current>System</span></button>
<style>.og-theme-toggle{border:1px solid var(--og-border,#dce6df);background:var(--og-surface,#fff);color:var(--og-text,#16251e);border-radius:99px;padding:9px 14px;cursor:pointer}</style>
