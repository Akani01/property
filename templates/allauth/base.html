{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OppoGlobe – Sign in / Sign up</title>

    <!-- Bootstrap + Font Awesome (same as your main site) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <style>
        /* Minimal OppoGlobe styling – you can copy the same root variables from your main CSS */
        :root {
            --primary-color: #ff4d3d;
            --secondary-color: #ff2e88;
            --dark-color: #191919;
            --light-color: #ffffff;
            --glass: rgba(255,255,255,0.92);
            --glass-border: #eaeaea;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --radius: 14px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        body {
            background: #f4f6f9;
            font-family: var(--font-body);
            color: var(--dark-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .auth-container {
            max-width: 480px;
            margin: auto;
            background: var(--light-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px 28px;
            border: 1px solid var(--glass-border);
        }
        .auth-container h2 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }
        .auth-container p {
            color: #666;
            font-size: 0.95rem;
        }
        .auth-container .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            font-weight: 600;
            padding: 10px;
            border-radius: 30px;
        }
        .auth-container .btn-primary:hover {
            opacity: 0.92;
            transform: scale(1.01);
        }
        .auth-container .form-control {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px 14px;
            font-size: 0.95rem;
        }
        .auth-container .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255,77,61,0.1);
        }
        .auth-container label {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .auth-container .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .auth-container .logo img {
            max-height: 50px;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888;
        }
        .auth-footer a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <a href="/">
                <img src="{% static 'images/logo.png' %}" alt="OppoGlobe" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\'font-weight:700;font-size:24px;\'>OppoGlobe</span>'">
            </a>
        </div>

        {% block content %}
        <!-- Allauth content goes here -->
        {% endblock %}

        <div class="auth-footer">
            <p>© 2026 OppoGlobe. All rights reserved.</p>
            <p><a href="/">Home</a> · <a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></p>
        </div>
    </div>

    <!-- Bootstrap JS (optional for toggles) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
