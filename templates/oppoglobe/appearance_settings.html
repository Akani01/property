<section class="og-appearance" aria-labelledby="og-appearance-title">
  <h2 id="og-appearance-title">Appearance</h2>
  <p>Choose how OppoGlobe looks on this device.</p>
  <fieldset aria-label="Theme preference">
    <label><input type="radio" name="og-theme" value="light" data-og-theme-choice> Light</label>
    <label><input type="radio" name="og-theme" value="dark" data-og-theme-choice> Dark</label>
    <label><input type="radio" name="og-theme" value="system" data-og-theme-choice> System</label>
  </fieldset>
</section>
