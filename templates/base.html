<style>

    :root {

        --primary: #ff4d3d;
        --secondary: #ff2e88;

        --dark: #191919;
        --muted: #737373;

        --border: #e5e5e5;

        --background: #f6f7f9;

        --white: #ffffff;

        --danger: #dc3545;

        --radius: 22px;

        --font-display:
            'Space Grotesk',
            sans-serif;

        --font-body:
            'Inter',
            sans-serif;
    }


    /* =========================================================
       RESET
    ========================================================== */

    *,
    *::before,
    *::after {

        box-sizing: border-box;
    }


    html,
    body {

        width: 100%;

        min-height: 100%;

        margin: 0;

        padding: 0;
    }


    body {

        font-family: var(--font-body);

        color: var(--dark);

        background:
            linear-gradient(
                135deg,
                #fafafa 0%,
                #f5f6f8 100%
            );

        -webkit-font-smoothing: antialiased;

        -moz-osx-font-smoothing: grayscale;
    }


    /* =========================================================
       FULL SCREEN AUTH AREA
    ========================================================== */

    .oppo-auth-wrapper {

        width: 100%;

        min-height: 100vh;

        min-height: 100dvh;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 40px 24px;
    }


    /* =========================================================
       AUTH CARD
    ========================================================== */

    .oppo-auth-card {

        width: 100%;

        max-width: 560px;

        background: var(--white);

        border: 1px solid rgba(0,0,0,.07);

        border-radius: var(--radius);

        padding: 48px;

        box-shadow:
            0 20px 70px
            rgba(0,0,0,.08);
    }


    /* =========================================================
       LOGO
    ========================================================== */

    .oppo-auth-logo {

        width: 100%;

        display: flex;

        justify-content: center;

        align-items: center;

        margin-bottom: 32px;
    }


    .oppo-auth-logo a {

        display: inline-flex;

        justify-content: center;

        align-items: center;

        text-decoration: none;
    }


    .oppo-auth-logo img {

        display: block;

        width: auto;

        height: auto;

        max-width: 200px;

        max-height: 70px;

        object-fit: contain;
    }


    .oppo-logo-text {

        font-family: var(--font-display);

        font-size: 2rem;

        font-weight: 700;

        color: var(--dark);

        letter-spacing: -1px;
    }


    /* =========================================================
       TYPOGRAPHY
    ========================================================== */

    .oppo-auth-card h1,
    .oppo-auth-card h2,
    .oppo-auth-card h3 {

        font-family: var(--font-display);

        color: var(--dark);

        font-weight: 700;
    }


    .oppo-auth-card p {

        line-height: 1.6;
    }


    /* =========================================================
       FORM LABELS
    ========================================================== */

    .oppo-auth-card label {

        display: block;

        margin-bottom: 7px;

        color: #252525;

        font-size: .88rem;

        font-weight: 600;
    }


    /* =========================================================
       INPUTS
    ========================================================== */

    .oppo-auth-card input[type="text"],
    .oppo-auth-card input[type="email"],
    .oppo-auth-card input[type="password"] {

        width: 100%;

        min-height: 52px;

        padding:
            13px
            15px;

        border:
            1px solid
            var(--border);

        border-radius: 11px;

        background: #ffffff;

        color: var(--dark);

        font-family: var(--font-body);

        font-size: .95rem;

        outline: none;

        transition:
            border-color .2s ease,
            box-shadow .2s ease;
    }


    .oppo-auth-card input:focus {

        border-color: var(--primary);

        box-shadow:
            0 0 0 4px
            rgba(255,77,61,.09);

        outline: none;
    }


    /* =========================================================
       CHECKBOX
    ========================================================== */

    .oppo-auth-card input[type="checkbox"] {

        width: 17px;

        height: 17px;

        accent-color: var(--primary);
    }


    /* =========================================================
       PRIMARY BUTTON
    ========================================================== */

    .oppo-primary-button {

        width: 100%;

        min-height: 52px;

        border: none;

        border-radius: 11px;

        background:
            linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );

        color: #ffffff;

        font-size: .95rem;

        font-weight: 600;

        cursor: pointer;

        transition:
            transform .2s ease,
            box-shadow .2s ease,
            opacity .2s ease;
    }


    .oppo-primary-button:hover {

        color: #ffffff;

        transform: translateY(-1px);

        box-shadow:
            0 10px 25px
            rgba(255,77,61,.20);
    }


    /* =========================================================
       GOOGLE BUTTON
    ========================================================== */

    .oppo-google-button {

        width: 100%;

        min-height: 52px;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 10px;

        border:
            1px solid
            #dcdcdc;

        border-radius: 11px;

        background: #ffffff;

        color: #222222;

        text-decoration: none;

        font-size: .94rem;

        font-weight: 600;

        transition:
            background .2s ease,
            border-color .2s ease,
            box-shadow .2s ease;
    }


    .oppo-google-button:hover {

        color: #222222;

        background: #fafafa;

        border-color: #cfcfcf;

        box-shadow:
            0 5px 15px
            rgba(0,0,0,.06);
    }


    .oppo-google-icon {

        width: 21px;

        height: 21px;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        font-size: 17px;

        font-weight: 700;
    }


    /* =========================================================
       DIVIDER
    ========================================================== */

    .oppo-divider {

        display: flex;

        align-items: center;

        gap: 14px;

        margin:
            26px
            0;
    }


    .oppo-divider::before,
    .oppo-divider::after {

        content: "";

        flex: 1;

        height: 1px;

        background: #e8e8e8;
    }


    .oppo-divider span {

        color: #999999;

        font-size: .76rem;

        font-weight: 600;

        text-transform: uppercase;
    }


    /* =========================================================
       LINKS
    ========================================================== */

    .oppo-auth-card a {

        color: var(--primary);

        text-decoration: none;
    }


    .oppo-auth-card a:hover {

        color: var(--secondary);
    }


    /* =========================================================
       ALERTS
    ========================================================== */

    .oppo-alert {

        border-radius: 11px;

        font-size: .87rem;

        padding: 12px 14px;

        margin-bottom: 18px;
    }


    /* =========================================================
       FOOTER
    ========================================================== */

    .oppo-auth-footer {

        text-align: center;

        margin-top: 30px;

        padding-top: 20px;

        border-top:
            1px solid
            #eeeeee;

        color: #999999;

        font-size: .76rem;
    }


    .oppo-auth-footer p {

        margin-bottom: 5px;
    }


    .oppo-auth-footer a {

        color: #777777;

        margin:
            0
            4px;
    }


    /* =========================================================
       LARGE DESKTOP
    ========================================================== */

    @media (min-width: 1200px) {

        .oppo-auth-wrapper {

            padding:
                60px
                30px;
        }


        .oppo-auth-card {

            max-width: 560px;

            padding: 52px;
        }

    }


    /* =========================================================
       TABLET
    ========================================================== */

    @media (max-width: 767.98px) {

        .oppo-auth-wrapper {

            align-items: flex-start;

            padding:
                25px
                15px;
        }


        .oppo-auth-card {

            max-width: 520px;

            padding:
                35px
                25px;

            border-radius: 19px;
        }


        .oppo-auth-logo {

            margin-bottom: 27px;
        }


        .oppo-auth-logo img {

            max-width: 165px;

            max-height: 58px;
        }

    }


    /* =========================================================
       SMALL PHONE
    ========================================================== */

    @media (max-width: 400px) {

        .oppo-auth-wrapper {

            padding:
                15px
                9px;
        }


        .oppo-auth-card {

            padding:
                28px
                18px;

            border-radius: 17px;
        }


        .oppo-auth-logo img {

            max-width: 145px;
        }

    }

</style>


{% block extra_css %}
{% endblock %}
