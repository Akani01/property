{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | OppoGlobe</title><link rel="stylesheet" href="{% static 'oppoglobe/theme.css' %}"><script src="{% static 'oppoglobe/theme.js' %}"></script><style>body{margin:0;font-family:system-ui;background:var(--og-bg);color:var(--og-text)}main{max-width:950px;margin:auto;padding:24px 16px}a{color:var(--og-accent)}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(26px,5vw,44px)}form{display:flex;flex-wrap:wrap;gap:10px}input,select{flex:1;min-width:190px;padding:14px;border-radius:12px;border:1px solid var(--og-border);background:var(--og-surface);color:var(--og-text);font-size:16px}button{padding:14px 20px;background:#13785a;color:white;border:0;border-radius:12px;cursor:pointer}.result{display:block;padding:18px;margin:12px 0;border:1px solid var(--og-border);border-radius:14px;background:var(--og-surface);text-decoration:none;color:var(--og-text)}.result small{display:block;color:var(--og-muted);margin-top:6px}.result strong{font-size:18px}.muted{color:var(--og-muted)}</style></head><body><main><header><strong>OppoGlobe Search</strong><a href="/">Home</a></header><h1>Find what matters to you.</h1><form id="search-form"><input id="q" placeholder="Search jobs, properties, schools, products…" required minlength="2" maxlength="100" autofocus><select id="category" aria-label="Category"><option value="all">Everything</option><option value="properties">Properties</option><option value="jobs">Jobs</option><option value="schools">Schools</option><option value="universities">Universities</option><option value="bursaries">Bursaries</option><option value="products">Products</option></select><button>Search</button></form><p class="muted" id="status" role="status">Only public listings appear here.</p><section id="results" aria-live="polite"></section></main><script>const form=document.getElementById('search-form'),q=document.getElementById('q'),cat=document.getElementById('category'),results=document.getElementById('results'),status=document.getElementById('status');async function run(){const text=q.value.trim();if(text.length<2)return;status.textContent='Searching…';results.replaceChildren();try{const r=await fetch('/api/search/?'+new URLSearchParams({q:text,category:cat.value}));if(!r.ok)throw Error('Search unavailable');const data=await r.json();status.textContent=data.results.length?data.results.length+' results':'No matches found';for(const item of data.results){const a=document.createElement('a');a.className='result';a.href=item.url;const title=document.createElement('strong');title.textContent=item.title;const detail=document.createElement('small');detail.textContent=item.type.toUpperCase()+' · '+item.detail;a.append(title,detail);results.append(a)}}catch(e){status.textContent='Search temporarily unavailable. Please try again.'}}form.addEventListener('submit',e=>{e.preventDefault();run()});const initial=new URLSearchParams(location.search).get('q');if(initial){q.value=initial;run()}</script></body></html>
