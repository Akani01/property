{% extends "base.html" %}

{% load i18n %}

{% block title %}Confirm Email | OppoGlobe{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

    <div class="col-12 col-md-7 col-lg-5">

        <div class="card border-0 shadow-sm rounded-4">

            <div class="card-body p-4 p-md-5 text-center">

                <div
                    class="mx-auto mb-4 d-flex align-items-center justify-content-center rounded-circle bg-light"
                    style="width: 80px; height: 80px;"
                >
                    <i class="bi bi-envelope-check fs-2"></i>
                </div>

                <h1 class="fw-bold mb-3">
                    Confirm your email
                </h1>

                <p class="text-muted mb-4">
                    Please confirm that
                    <strong>{{ email_address.email }}</strong>
                    belongs to you.
                </p>

                <form method="post">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger w-100 py-3 rounded-3 fw-semibold"
                    >
                        Confirm Email
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</div>

{% endblock %}
