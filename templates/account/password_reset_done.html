{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h3 class="mb-0">{% trans "Check Your Email" %}</h3>
                </div>
                <div class="card-body text-center">
                    <p class="text-muted">{% trans "We've sent you a password reset link. Please check your email." %}</p>
                    <a href="{% url 'account_login' %}" class="btn btn-primary">{% trans "Return to Login" %}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
