{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">{% trans "Password Reset Complete" %}</h3>
                </div>
                <div class="card-body text-center">
                    <p class="text-muted">{% trans "Your password has been reset. You can now login with your new password." %}</p>
                    <a href="{% url 'account_login' %}" class="btn btn-primary">{% trans "Login Now" %}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
