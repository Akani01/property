{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">{% trans "Set New Password" %}</h3>
                </div>
                <div class="card-body">
                    {% if token_fail %}
                        <div class="alert alert-danger">
                            {% trans "Invalid or expired reset link." %}
                            <a href="{% url 'account_reset_password' %}" class="alert-link">{% trans "Request new link" %}</a>
                        </div>
                    {% else %}
                        <form method="POST" action="{{ action_url }}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="id_password1" class="form-label">{% trans "New Password" %}</label>
                                <input type="password" name="password1" id="id_password1" class="form-control" required minlength="8">
                            </div>
                            <div class="mb-3">
                                <label for="id_password2" class="form-label">{% trans "Confirm Password" %}</label>
                                <input type="password" name="password2" id="id_password2" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">{% trans "Reset Password" %}</button>
                        </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
