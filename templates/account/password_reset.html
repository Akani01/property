{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">{% trans "Reset Password" %}</h3>
                </div>
                <div class="card-body">
                    <p class="text-muted">{% trans "Enter your email address and we'll send you a reset link." %}</p>
                    <form method="POST" action="{% url 'account_reset_password' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_email" class="form-label">{% trans "Email" %}</label>
                            <input type="email" name="email" id="id_email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">{% trans "Send Reset Link" %}</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="{% url 'account_login' %}" class="text-decoration-none">{% trans "Back to Login" %}</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
