<!-- templates/notifications/notifications.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .notification-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s;
            cursor: pointer;
        }
        .notification-item:hover {
            background-color: #f8f9fa;
        }
        .notification-item.unread {
            background-color: #f0f7ff;
            border-left: 4px solid #0d6efd;
        }
        .notification-item .icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }
        .notification-item .time-ago {
            font-size: 12px;
            color: #6c757d;
        }
        .notification-item .title {
            font-weight: 500;
            margin-bottom: 5px;
        }
        .notification-item .message {
            color: #6c757d;
            font-size: 14px;
        }
        .badge-unread {
            background-color: #0d6efd;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .notification-actions .btn {
            padding: 2px 8px;
            font-size: 12px;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0d6efd;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 60px;
            margin-bottom: 20px;
            color: #dee2e6;
        }
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 9999;
        }
        .toast {
            min-width: 300px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-bell me-2"></i>
                            Notifications
                            <span class="badge bg-primary ms-2" id="unreadCount">0</span>
                        </h5>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-success" id="createTestBtn">
                                <i class="fas fa-plus"></i> Test
                            </button>
                            <button class="btn btn-sm btn-outline-primary" id="markAllReadBtn">
                                <i class="fas fa-check-double"></i> Mark all read
                            </button>
                            <button class="btn btn-sm btn-outline-danger" id="clearAllBtn">
                                <i class="fas fa-trash"></i> Clear all
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-0" id="notificationsContainer">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p class="mt-3">Loading notifications...</p>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <button class="btn btn-link" id="loadMoreBtn" style="display:none;">
                            Load more <i class="fas fa-arrow-down"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            let currentPage = 1;
            let isLoading = false;
            let hasMore = true;
            let allNotifications = [];
            let lastNotificationId = null;
            
            // Get CSRF token
            function getCSRFToken() {
                return $('meta[name="csrf-token"]').attr('content');
            }
            
            // Load notifications
            function loadNotifications(page = 1, append = false) {
                if (isLoading) return;
                isLoading = true;
                
                if (!append) {
                    $('#notificationsContainer').html(`
                        <div class="loading">
                            <div class="spinner"></div>
                            <p class="mt-3">Loading notifications...</p>
                        </div>
                    `);
                }
                
                $.ajax({
                    url: `/notifications/api/notifications/?page=${page}&page_size=20`,
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': getCSRFToken()
                    },
                    success: function(response) {
                        isLoading = false;
                        
                        if (response.status === 'success') {
                            const data = response.data || {};
                            const notifications = data.notifications || [];
                            
                            if (!append) {
                                allNotifications = notifications;
                            } else {
                                allNotifications = [...allNotifications, ...notifications];
                            }
                            
                            // Update unread count
                            const unreadCount = data.unread_count || 0;
                            $('#unreadCount').text(unreadCount);
                            updateBadge(unreadCount);
                            
                            if (notifications.length === 0 && !append) {
                                $('#notificationsContainer').html(`
                                    <div class="empty-state">
                                        <i class="fas fa-bell-slash"></i>
                                        <h5>No notifications</h5>
                                        <p>Click the "Test" button to create a test notification.</p>
                                    </div>
                                `);
                                $('#loadMoreBtn').hide();
                                hasMore = false;
                            } else {
                                let html = '';
                                notifications.forEach(function(notif) {
                                    const isUnread = !notif.is_read;
                                    const icon = notif.icon_class || 'fas fa-bell';
                                    const color = notif.color || '#0d6efd';
                                    const message = notif.formatted_message || notif.message || '';
                                    
                                    html += `
                                        <div class="notification-item ${isUnread ? 'unread' : ''}" 
                                             data-id="${notif.id}">
                                            <div class="row align-items-center">
                                                <div class="col-auto">
                                                    <div class="icon" style="background-color: ${color}">
                                                        <i class="${icon}"></i>
                                                    </div>
                                                </div>
                                                <div class="col">
                                                    <div class="title">${notif.title || 'Untitled'}</div>
                                                    <div class="message">${message}</div>
                                                    <div class="time-ago">
                                                        <i class="far fa-clock me-1"></i>
                                                        ${notif.time_ago || 'Just now'}
                                                        ${isUnread ? '<span class="badge-unread ms-2">New</span>' : ''}
                                                    </div>
                                                </div>
                                                <div class="col-auto">
                                                    <div class="notification-actions">
                                                        ${!notif.is_read ? `
                                                            <button class="btn btn-sm btn-outline-primary mark-read-btn" data-id="${notif.id}">
                                                                <i class="fas fa-check"></i>
                                                            </button>
                                                        ` : ''}
                                                        <button class="btn btn-sm btn-outline-danger dismiss-btn" data-id="${notif.id}">
                                                            <i class="fas fa-times"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                });
                                
                                if (append) {
                                    $('#notificationsContainer').append(html);
                                } else {
                                    $('#notificationsContainer').html(html);
                                }
                                
                                hasMore = data.pagination && data.pagination.has_next;
                                if (hasMore) {
                                    $('#loadMoreBtn').show();
                                } else {
                                    $('#loadMoreBtn').hide();
                                }
                            }
                        } else {
                            $('#notificationsContainer').html(`
                                <div class="empty-state text-danger">
                                    <i class="fas fa-exclamation-circle"></i>
                                    <h5>Error loading notifications</h5>
                                    <p>${response.message || 'Please try again later'}</p>
                                </div>
                            `);
                        }
                    },
                    error: function(xhr) {
                        isLoading = false;
                        console.error('Error loading notifications:', xhr.responseText);
                        let errorMsg = 'Please try again later';
                        try {
                            const response = JSON.parse(xhr.responseText);
                            if (response.message) errorMsg = response.message;
                            if (response.error) errorMsg = response.error;
                        } catch(e) {}
                        $('#notificationsContainer').html(`
                            <div class="empty-state text-danger">
                                <i class="fas fa-exclamation-circle"></i>
                                <h5>Error loading notifications</h5>
                                <p>${errorMsg}</p>
                                <button class="btn btn-primary btn-sm mt-2" onclick="location.reload()">
                                    <i class="fas fa-sync"></i> Retry
                                </button>
                            </div>
                        `);
                    }
                });
            }
            
            // Mark notification as read
            function markAsRead(notificationId) {
                $.ajax({
                    url: `/notifications/api/notifications/${notificationId}/mark_read/`,
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCSRFToken()
                    },
                    success: function(response) {
                        if (response.status === 'success') {
                            loadNotifications(1, false);
                            showToast('Notification marked as read', 'success');
                        }
                    },
                    error: function(xhr) {
                        console.error('Error marking as read:', xhr.responseText);
                    }
                });
            }
            
            // Dismiss notification
            function dismissNotification(notificationId) {
                $.ajax({
                    url: `/notifications/api/notifications/${notificationId}/dismiss/`,
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCSRFToken()
                    },
                    success: function(response) {
                        if (response.status === 'success') {
                            loadNotifications(1, false);
                            showToast('Notification dismissed', 'info');
                        }
                    },
                    error: function(xhr) {
                        console.error('Error dismissing notification:', xhr.responseText);
                    }
                });
            }
            
            // Mark all as read
            function markAllAsRead() {
                $.ajax({
                    url: `/notifications/api/notifications/mark_all_read/`,
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCSRFToken()
                    },
                    success: function(response) {
                        if (response.status === 'success') {
                            loadNotifications(1, false);
                            showToast('All notifications marked as read', 'success');
                        }
                    },
                    error: function(xhr) {
                        console.error('Error marking all as read:', xhr.responseText);
                    }
                });
            }
            
            // Clear all notifications
            function clearAllNotifications() {
                if (confirm('Are you sure you want to clear all notifications?')) {
                    $.ajax({
                        url: `/notifications/api/notifications/clear_all/`,
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': getCSRFToken()
                        },
                        success: function(response) {
                            if (response.status === 'success') {
                                loadNotifications(1, false);
                                showToast('All notifications cleared', 'info');
                            }
                        },
                        error: function(xhr) {
                            console.error('Error clearing notifications:', xhr.responseText);
                        }
                    });
                }
            }
            
            // Create test notification
            function createTestNotification() {
                const btn = $('#createTestBtn');
                const originalHtml = btn.html();
                btn.html('<span class="spinner-border spinner-border-sm" role="status"></span>');
                btn.prop('disabled', true);
                
                $.ajax({
                    url: `/notifications/api/notifications/create_test/`,
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCSRFToken()
                    },
                    success: function(response) {
                        btn.html(originalHtml);
                        btn.prop('disabled', false);
                        
                        if (response.status === 'success') {
                            showToast('✅ Test notification created!', 'success');
                            loadNotifications(1, false);
                        } else {
                            showToast('Error: ' + (response.message || 'Unknown error'), 'error');
                        }
                    },
                    error: function(xhr) {
                        btn.html(originalHtml);
                        btn.prop('disabled', false);
                        console.error('Error creating test notification:', xhr.responseText);
                        showToast('Error creating test notification', 'error');
                    }
                });
            }
            
            // Update badge in header
            function updateBadge(count) {
                const badge = document.querySelector('.notification-badge');
                if (badge) {
                    if (count > 0) {
                        badge.textContent = count > 99 ? '99+' : count;
                        badge.style.display = 'block';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            }
            
            // Show toast notification
            function showToast(message, type = 'info') {
                const container = document.querySelector('.toast-container');
                if (!container) return;
                
                const colors = {
                    success: '#28a745',
                    error: '#dc3545',
                    info: '#17a2b8',
                    warning: '#ffc107'
                };
                
                const toast = document.createElement('div');
                toast.className = `toast show align-items-center text-white border-0`;
                toast.style.background = colors[type] || colors.info;
                toast.innerHTML = `
                    <div class="d-flex">
                        <div class="toast-body">
                            <i class="fas fa-${type === 'success' ? 'check-circle' : 'info-circle'} me-2"></i>
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.parentElement.parentElement.remove()"></button>
                    </div>
                `;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 5000);
            }
            
            // Show notification toast for new notifications
            function showNotificationToast(notification) {
                const container = document.querySelector('.toast-container');
                if (!container) return;
                
                const color = notification.color || '#0d6efd';
                const icon = notification.icon_class || 'fas fa-bell';
                
                const toast = document.createElement('div');
                toast.className = 'toast show align-items-center border-0';
                toast.style.background = 'white';
                toast.style.borderLeft = `4px solid ${color}`;
                toast.style.boxShadow = '0 4px 15px rgba(0,0,0,0.15)';
                toast.style.borderRadius = '8px';
                toast.style.cursor = 'pointer';
                
                toast.innerHTML = `
                    <div class="d-flex p-3">
                        <div style="width:40px;height:40px;border-radius:50%;background:${color}20;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px;">
                            <i class="${icon}" style="color:${color};font-size:18px;"></i>
                        </div>
                        <div style="flex:1;min-width:0;">
                            <div style="font-weight:600;font-size:14px;color:#333;">${notification.title}</div>
                            <div style="font-size:13px;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${notification.message.replace(/<[^>]*>/g, '')}</div>
                        </div>
                        <button type="button" class="btn-close" style="font-size:10px;" onclick="this.parentElement.parentElement.remove()"></button>
                    </div>
                `;
                
                toast.addEventListener('click', function() {
                    if (notification.action_url) {
                        window.location.href = notification.action_url;
                    }
                    this.remove();
                });
                
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 5000);
            }
            
            // Poll for realtime notifications
            function pollRealtimeNotifications() {
                $.ajax({
                    url: `/notifications/api/notifications/realtime/`,
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': getCSRFToken()
                    },
                    success: function(response) {
                        if (response.status === 'success') {
                            const data = response.data || {};
                            const unreadCount = data.unread_count || 0;
                            
                            // Update badge
                            updateBadge(unreadCount);
                            $('#unreadCount').text(unreadCount);
                            
                            // Check for new notifications
                            if (data.notifications && data.notifications.length > 0) {
                                const latest = data.notifications[0];
                                if (latest && latest.id !== lastNotificationId) {
                                    lastNotificationId = latest.id;
                                    showNotificationToast(latest);
                                    // Reload to show new notification
                                    loadNotifications(1, false);
                                }
                            }
                        }
                    },
                    error: function(xhr) {
                        // Silently fail for realtime polling
                        console.log('Realtime poll error (non-critical):', xhr.status);
                    }
                });
            }
            
            // Event handlers
            $(document).on('click', '.mark-read-btn', function(e) {
                e.stopPropagation();
                const id = $(this).data('id');
                markAsRead(id);
            });
            
            $(document).on('click', '.dismiss-btn', function(e) {
                e.stopPropagation();
                const id = $(this).data('id');
                dismissNotification(id);
            });
            
            $('#createTestBtn').click(createTestNotification);
            $('#markAllReadBtn').click(markAllAsRead);
            $('#clearAllBtn').click(clearAllNotifications);
            
            $('#loadMoreBtn').click(function() {
                currentPage++;
                loadNotifications(currentPage, true);
            });
            
            // Initial load
            loadNotifications(1, false);
            
            // Refresh every 30 seconds
            setInterval(function() {
                loadNotifications(1, false);
            }, 30000);
            
            // Poll for realtime every 10 seconds
            setInterval(pollRealtimeNotifications, 10000);
        });
    </script>
</body>
</html>
